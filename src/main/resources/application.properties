# Application Configuration
spring.application.name=bookverse
server.port=${SERVER_PORT:8080}

# Database Configuration (Defaults to embedded file-based H2 with MySQL compatibility for persistent storage across restarts, or MySQL when DB_URL is provided)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bookversedb;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# H2 Console (Allowed in Dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security Configuration
bookverse.admin.email=${ADMIN_EMAIL:admin@bookverse.com}
bookverse.admin.password=${ADMIN_PASSWORD:Admin@123456}
bookverse.admin.name=${ADMIN_FULL_NAME:System Admin}

# Open Library API
bookverse.open-library.base-url=https://openlibrary.org
bookverse.open-library.covers-base-url=https://covers.openlibrary.org

# Springdoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
