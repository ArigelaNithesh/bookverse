<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — BOOKVERSE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bv-navbar sticky-top">
    <div class="container">
      <a class="bv-brand" href="/index.html"><i class="bi bi-book-half fs-3"></i><span>BOOKVERSE</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto ms-3">
          <li class="nav-item"><a class="nav-link bv-nav-link" href="/books.html">Browse Books</a></li>
          <li class="nav-item"><a class="nav-link bv-nav-link" href="/read.html">Digital Reader</a></li>
        </ul>
      </div>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/cart.html" class="btn btn-sm btn-bv-outline position-relative px-2 py-1"><i class="bi bi-cart3 fs-6"></i><span id="cart-counter-badge" class="nav-badge" style="display:none;">0</span></a>
        <div id="nav-user-slot" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-heart text-danger me-2"></i>My Wishlist</h1>

    <div id="wishlist-loading" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-muted">Loading your saved books...</p>
    </div>

    <div id="wishlist-grid" class="row g-4" style="display: none;"></div>

    <div id="wishlist-empty" class="empty-state-box my-4" style="display: none;">
      <i class="bi bi-heartbreak fs-1 text-muted d-block mb-2"></i>
      <h4 class="fw-bold mb-2">Your Wishlist is Empty</h4>
      <p class="text-muted small mb-3">Explore the catalog and save books you want to read later.</p>
      <a href="/books.html" class="btn btn-bv-primary px-4 py-2">Explore Catalog</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadWishlist() {
      const meRes = await fetch('/api/auth/me');
      if (!meRes.ok) {
        window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.href)}`;
        return;
      }

      try {
        const res = await Bookverse.apiFetch('/api/wishlist');
        document.getElementById('wishlist-loading').style.display = 'none';

        if (!res.data || !res.data.books || res.data.books.length === 0) {
          document.getElementById('wishlist-empty').style.display = 'block';
          return;
        }

        const grid = document.getElementById('wishlist-grid');
        grid.style.display = 'flex';

        grid.innerHTML = res.data.books.map(b => `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="card h-100 border-0 shadow-sm rounded-3 overflow-hidden bg-white">
              <div class="book-cover-wrap">
                <img src="${b.coverImageUrl || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80'}" class="book-cover-img" alt="${b.title}">
              </div>
              <div class="card-body p-3 d-flex flex-column">
                <div class="small text-muted mb-1">${b.categoryName || 'General'}</div>
                <h6 class="fw-bold mb-1 text-truncate"><a href="/book-details.html?slug=${b.slug}" class="text-dark text-decoration-none">${b.title}</a></h6>
                <div class="small text-muted mb-2">${b.authorName || 'Author'}</div>
                <div class="fw-bold text-danger mb-3 mt-auto">${Bookverse.formatCurrency(b.sellingPrice)}</div>
                <div class="d-flex gap-2">
                  <button class="btn btn-sm btn-bv-primary flex-grow-1" onclick="Bookverse.addToCart(${b.id}, 1)">
                    <i class="bi bi-cart-plus me-1"></i>To Cart
                  </button>
                  <button class="btn btn-sm btn-outline-danger" title="Remove" onclick="removeFromWishlist(${b.id})">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('wishlist-loading').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    async function removeFromWishlist(bookId) {
      // Find item
      try {
        await Bookverse.apiFetch(`/api/wishlist/items/${bookId}`, { method: 'DELETE' });
        Bookverse.showToast("Removed from wishlist", "info");
        loadWishlist();
        Bookverse.refreshCounters();
      } catch (err) {
        Bookverse.showToast(err.message, "error");
      }
    }

    document.addEventListener('DOMContentLoaded', loadWishlist);
  </script>
</body>
</html>
