<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — BOOKVERSE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bv-navbar sticky-top">
    <div class="container">
      <a class="bv-brand" href="/index.html"><i class="bi bi-book-half fs-3"></i><span>BOOKVERSE</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto ms-3">
          <li class="nav-item"><a class="nav-link bv-nav-link" href="/books.html">Browse Books</a></li>
          <li class="nav-item"><a class="nav-link bv-nav-link" href="/read.html">Digital Reader</a></li>
        </ul>
      </div>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/cart.html" class="btn btn-sm btn-bv-outline position-relative px-2 py-1"><i class="bi bi-cart3 fs-6"></i><span id="cart-counter-badge" class="nav-badge" style="display:none;">0</span></a>
        <div id="nav-user-slot" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-box-seam me-2"></i>My Order History</h1>

    <div id="orders-loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Retrieving your orders...</p>
    </div>

    <div id="orders-list-container" class="d-flex flex-column gap-3" style="display: none;"></div>

    <div id="orders-empty" class="empty-state-box my-4" style="display: none;">
      <i class="bi bi-box2 fs-1 text-muted d-block mb-2"></i>
      <h4 class="fw-bold mb-2">No Orders Found</h4>
      <p class="text-muted small mb-3">You haven't placed any book orders yet.</p>
      <a href="/books.html" class="btn btn-bv-primary px-4 py-2">Explore Books Catalog</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadOrders() {
      const meRes = await fetch('/api/auth/me');
      if (!meRes.ok) {
        window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.href)}`;
        return;
      }

      try {
        const res = await Bookverse.apiFetch('/api/orders');
        document.getElementById('orders-loading').style.display = 'none';

        if (!res.data || res.data.length === 0) {
          document.getElementById('orders-empty').style.display = 'block';
          return;
        }

        const container = document.getElementById('orders-list-container');
        container.style.display = 'flex';

        container.innerHTML = res.data.map(order => {
          const statusBadge = getStatusBadge(order.orderStatus);
          const itemCount = order.items ? order.items.reduce((acc, i) => acc + i.quantity, 0) : 0;
          const dateStr = new Date(order.createdAt).toLocaleDateString('en-IN', {
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });

          return `
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 border-bottom pb-2 mb-2">
                <div>
                  <span class="fw-bold text-dark me-2">Order #${order.orderNumber}</span>
                  <span class="text-muted small">${dateStr}</span>
                </div>
                <div>
                  ${statusBadge}
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 pt-1">
                <div>
                  <div class="small text-muted">Items: ${itemCount} book(s)</div>
                  <div class="fw-bold fs-5 text-danger">${Bookverse.formatCurrency(order.grandTotal)}</div>
                </div>
                <a href="/order-details.html?id=${order.id}" class="btn btn-sm btn-bv-outline">
                  View Order Details <i class="bi bi-chevron-right ms-1"></i>
                </a>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('orders-loading').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'PLACED': return '<span class="badge bg-primary-subtle text-primary">Order Placed</span>';
        case 'CONFIRMED': return '<span class="badge bg-info-subtle text-info">Confirmed</span>';
        case 'PACKED': return '<span class="badge bg-warning-subtle text-warning">Packed</span>';
        case 'SHIPPED': return '<span class="badge bg-primary-subtle text-primary">Shipped</span>';
        case 'DELIVERED': return '<span class="badge bg-success-subtle text-success">Delivered</span>';
        case 'CANCELLED': return '<span class="badge bg-danger-subtle text-danger">Cancelled</span>';
        default: return `<span class="badge bg-secondary">${status}</span>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
