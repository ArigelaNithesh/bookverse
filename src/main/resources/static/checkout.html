<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — BOOKVERSE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="py-3 bg-white border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="bv-brand text-decoration-none" href="/index.html">
        <i class="bi bi-book-half fs-3"></i><span>BOOKVERSE</span>
      </a>
      <a href="/cart.html" class="btn btn-sm btn-bv-outline"><i class="bi bi-arrow-left me-1"></i>Back to Cart</a>
    </div>
  </header>

  <main class="container py-4">
    <h1 class="h3 fw-bold mb-4">Complete Your Order</h1>

    <div class="row g-4">
      <!-- Checkout Form -->
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm rounded-3 p-4 bg-white mb-4">
          <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="bi bi-geo-alt me-2 text-danger"></i>Delivery Address</h5>

          <!-- Saved addresses if any -->
          <div id="saved-addresses-block" class="mb-3" style="display: none;">
            <label class="form-label small fw-semibold">Choose a Saved Address:</label>
            <div id="saved-addresses-list" class="d-flex flex-column gap-2 mb-3"></div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="addressSelect" id="addr-new" value="new" checked onchange="toggleAddressForm()">
              <label class="form-check-label small fw-medium" for="addr-new">Deliver to a new address</label>
            </div>
          </div>

          <form id="new-address-form">
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label small fw-semibold">Recipient Full Name</label>
                <input type="text" id="ship-name" class="form-control" required placeholder="e.g. Nithesh Kumar">
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-semibold">Contact Phone Number</label>
                <input type="tel" id="ship-phone" class="form-control" required placeholder="+91 9876543210">
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Street Address / House No.</label>
                <input type="text" id="ship-street" class="form-control" required placeholder="Apartment, suite, unit, building, floor">
              </div>
              <div class="col-sm-4">
                <label class="form-label small fw-semibold">City</label>
                <input type="text" id="ship-city" class="form-control" required placeholder="Hyderabad">
              </div>
              <div class="col-sm-4">
                <label class="form-label small fw-semibold">State</label>
                <input type="text" id="ship-state" class="form-control" required placeholder="Telangana">
              </div>
              <div class="col-sm-4">
                <label class="form-label small fw-semibold">PIN Code</label>
                <input type="text" id="ship-pin" class="form-control" required placeholder="500001">
              </div>
            </div>
          </form>
        </div>

        <!-- Payment Method -->
        <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
          <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="bi bi-credit-card me-2 text-primary"></i>Payment Method</h5>
          <div class="form-check p-3 border rounded-3 mb-2 bg-light">
            <input class="form-check-input" type="radio" name="paymentMethod" id="pay-cod" value="CASH_ON_DELIVERY" checked>
            <label class="form-check-label fw-medium" for="pay-cod">
              <i class="bi bi-cash-stack text-success me-2"></i>Cash on Delivery (Standard Project Option)
              <div class="small text-muted fw-normal">Pay cash or UPI scan when your books arrive at your doorstep.</div>
            </label>
          </div>
        </div>
      </div>

      <!-- Order Review Sidebar -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
          <h5 class="fw-bold mb-3 border-bottom pb-2">Order Review</h5>
          <div id="checkout-items-list" class="d-flex flex-column gap-3 mb-4">
            <!-- Dynamic items -->
          </div>

          <div class="d-flex justify-content-between mb-2 small">
            <span class="text-muted">Subtotal:</span>
            <span class="fw-bold text-dark" id="checkout-subtotal">₹0.00</span>
          </div>

          <div class="d-flex justify-content-between mb-2 small text-success" id="checkout-discount-row" style="display: none !important;">
            <span>Coupon Discount:</span>
            <span class="fw-bold" id="checkout-discount">-₹0.00</span>
          </div>

          <div class="d-flex justify-content-between mb-3 small">
            <span class="text-muted">Delivery Charges:</span>
            <span class="text-success fw-medium">FREE</span>
          </div>

          <div class="d-flex justify-content-between border-top pt-3 mb-4">
            <span class="fw-bold fs-5">Final Amount:</span>
            <span class="fw-bold fs-4 text-danger" id="checkout-total">₹0.00</span>
          </div>

          <button class="btn btn-bv-primary btn-lg w-100 fw-semibold" id="place-order-btn" onclick="placeOrder()">
            Confirm & Place Order
          </button>
          <p class="small text-muted text-center mt-3 mb-0">
            <i class="bi bi-shield-check text-success me-1"></i>Secure atomic checkout with real inventory locking.
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let cart = null;
    let savedAddresses = [];
    let couponCode = sessionStorage.getItem('bv_coupon_code') || '';
    let discountAmount = 0;

    async function initCheckout() {
      const meRes = await fetch('/api/auth/me');
      if (!meRes.ok) {
        window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.href)}`;
        return;
      }

      // Load cart
      try {
        const cartRes = await Bookverse.apiFetch('/api/cart');
        if (!cartRes.data || !cartRes.data.items || cartRes.data.items.length === 0) {
          window.location.href = '/cart.html';
          return;
        }
        cart = cartRes.data;
        renderCheckoutItems();
      } catch (err) {
        window.location.href = '/cart.html';
        return;
      }

      // Load addresses
      try {
        const addrRes = await Bookverse.apiFetch('/api/addresses');
        if (addrRes.data && addrRes.data.length > 0) {
          savedAddresses = addrRes.data;
          renderSavedAddresses();
        }
      } catch (e) {
        console.warn("Addresses load failed", e);
      }

      // Validate saved coupon
      if (couponCode) {
        try {
          const cRes = await Bookverse.apiFetch('/api/coupons/validate', {
            method: 'POST',
            body: { code: couponCode, subtotal: cart.subtotal }
          });
          if (cRes.data && cRes.data.valid) {
            discountAmount = cRes.data.discountAmount;
          }
        } catch (e) {}
      }

      updateTotals();
    }

    function renderCheckoutItems() {
      const container = document.getElementById('checkout-items-list');
      container.innerHTML = cart.items.map(i => `
        <div class="d-flex align-items-center gap-3 border-bottom pb-2">
          <img src="${i.coverImageUrl || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80'}" style="width: 45px; height: 60px; object-fit: cover;" class="rounded">
          <div class="flex-grow-1 small">
            <div class="fw-semibold text-truncate" style="max-width: 220px;">${i.bookTitle}</div>
            <div class="text-muted">Qty: ${i.quantity} × ${Bookverse.formatCurrency(i.unitPrice)}</div>
          </div>
          <div class="fw-bold small text-dark">${Bookverse.formatCurrency(i.lineTotal)}</div>
        </div>
      `).join('');
    }

    function renderSavedAddresses() {
      const block = document.getElementById('saved-addresses-block');
      const list = document.getElementById('saved-addresses-list');
      block.style.display = 'block';

      list.innerHTML = savedAddresses.map((a, idx) => `
        <div class="form-check p-3 border rounded-3 bg-light">
          <input class="form-check-input" type="radio" name="addressSelect" id="addr-${a.id}" value="${a.id}" ${idx === 0 ? 'checked' : ''} onchange="toggleAddressForm()">
          <label class="form-check-label small" for="addr-${a.id}">
            <strong>${a.recipientName}</strong> (${a.phoneNumber})<br>
            ${a.streetAddress}, ${a.city}, ${a.state} - ${a.postalCode}
          </label>
        </div>
      `).join('');

      toggleAddressForm();
    }

    function toggleAddressForm() {
      const selected = document.querySelector('input[name="addressSelect"]:checked');
      const form = document.getElementById('new-address-form');
      if (selected && selected.value !== 'new') {
        form.style.display = 'none';
      } else {
        form.style.display = 'block';
      }
    }

    function updateTotals() {
      const subtotal = cart.subtotal || 0;
      document.getElementById('checkout-subtotal').textContent = Bookverse.formatCurrency(subtotal);

      if (discountAmount > 0) {
        document.getElementById('checkout-discount-row').style.setProperty('display', 'flex', 'important');
        document.getElementById('checkout-discount').textContent = `-${Bookverse.formatCurrency(discountAmount)}`;
      }

      const total = Math.max(0, subtotal - discountAmount);
      document.getElementById('checkout-total').textContent = Bookverse.formatCurrency(total);
    }

    async function placeOrder() {
      const btn = document.getElementById('place-order-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Placing Order...';

      const selectedAddr = document.querySelector('input[name="addressSelect"]:checked');
      let payload = {
        paymentMethod: "CASH_ON_DELIVERY",
        couponCode: couponCode || null
      };

      if (selectedAddr && selectedAddr.value !== 'new') {
        payload.addressId = parseInt(selectedAddr.value);
      } else {
        const name = document.getElementById('ship-name').value.trim();
        const phone = document.getElementById('ship-phone').value.trim();
        const street = document.getElementById('ship-street').value.trim();
        const city = document.getElementById('ship-city').value.trim();
        const state = document.getElementById('ship-state').value.trim();
        const postal = document.getElementById('ship-pin').value.trim();

        if (!name || !street || !city || !state || !postal) {
          Bookverse.showToast("Please fill in all address fields", "error");
          btn.disabled = false;
          btn.textContent = 'Confirm & Place Order';
          return;
        }

        payload.newAddress = {
          recipientName: name,
          phoneNumber: phone,
          streetAddress: street,
          city: city,
          state: state,
          postalCode: postal,
          country: 'India'
        };
      }

      try {
        const res = await Bookverse.apiFetch('/api/orders', {
          method: 'POST',
          body: payload
        });

        sessionStorage.removeItem('bv_coupon_code');
        Bookverse.showToast("Order placed successfully!", "success");
        setTimeout(() => {
          window.location.href = `/order-details.html?id=${res.data.id}`;
        }, 800);
      } catch (err) {
        Bookverse.showToast(err.message || "Failed to place order", "error");
        btn.disabled = false;
        btn.textContent = 'Confirm & Place Order';
      }
    }

    document.addEventListener('DOMContentLoaded', initCheckout);
  </script>
</body>
</html>
