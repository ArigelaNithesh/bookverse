<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BOOKVERSE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Minimal Nav -->
  <header class="py-3 bg-white border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="bv-brand text-decoration-none" href="/index.html">
        <i class="bi bi-book-half fs-3"></i>
        <span>BOOKVERSE</span>
      </a>
      <a href="/index.html" class="btn btn-sm btn-bv-outline">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </div>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">

        <!-- Demo credentials pill -->
        <div class="card border-warning mb-4 bg-warning bg-opacity-10 shadow-sm">
          <div class="card-body p-3 small">
            <h6 class="fw-bold text-warning-emphasis mb-2"><i class="bi bi-key-fill me-1"></i>Quick Demo Credentials:</h6>
            <div class="d-flex justify-content-between mb-1">
              <span><strong>Admin:</strong> admin@bookverse.com</span>
              <button class="btn btn-xs btn-outline-dark py-0 px-2" onclick="fillCreds('admin@bookverse.com', 'Admin@123456')">Use</button>
            </div>
            <div class="d-flex justify-content-between">
              <span><strong>Student:</strong> student@bookverse.com</span>
              <button class="btn btn-xs btn-outline-dark py-0 px-2" onclick="fillCreds('student@bookverse.com', 'Student@123456')">Use</button>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold mb-1">Welcome Back</h2>
              <p class="text-muted small">Sign in to manage your orders, cart, and reading history</p>
            </div>

            <form id="login-form">
              <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" required placeholder="••••••••">
                </div>
              </div>

              <div class="d-grid gap-2 mt-4">
                <button type="submit" id="login-btn" class="btn btn-bv-primary btn-lg">
                  Sign In
                </button>
              </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top small text-muted">
              Don't have an account? <a href="/register.html" class="text-decoration-none fw-semibold text-primary">Create one here</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    function fillCreds(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      try {
        const res = await Bookverse.apiFetch('/api/auth/login', {
          method: 'POST',
          body: { email, password }
        });

        Bookverse.showToast("Signed in successfully!", "success");
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');
        
        setTimeout(() => {
          if (redirect) {
            window.location.href = redirect;
          } else if (res.data && res.data.roles && res.data.roles.includes('ROLE_ADMIN')) {
            window.location.href = '/admin/index.html';
          } else {
            window.location.href = '/index.html';
          }
        }, 800);
      } catch (err) {
        Bookverse.showToast(err.message || "Invalid email or password", "error");
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
