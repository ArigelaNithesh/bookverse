<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details — BOOKVERSE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="py-3 bg-white border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="bv-brand text-decoration-none" href="/index.html">
        <i class="bi bi-book-half fs-3"></i><span>BOOKVERSE</span>
      </a>
      <a href="/orders.html" class="btn btn-sm btn-bv-outline"><i class="bi bi-arrow-left me-1"></i>All Orders</a>
    </div>
  </header>

  <main class="container py-4">
    <div id="order-loading" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-muted">Loading order details...</p>
    </div>

    <div id="order-content" style="display: none;">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
          <h1 class="h3 fw-bold mb-1" id="order-number-title">Order #</h1>
          <p class="text-muted small mb-0" id="order-date-text"></p>
        </div>
        <div class="d-flex gap-2 align-items-center" id="order-actions-slot">
          <!-- Cancel button if eligible -->
        </div>
      </div>

      <div class="row g-4">
        <!-- Ordered Items -->
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm rounded-3 p-4 bg-white mb-4">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Purchased Items Snapshot</h5>
            <div id="order-items-container" class="d-flex flex-column gap-3"></div>
          </div>

          <!-- Status & Payment Info -->
          <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Status & Payment</h5>
            <div class="row g-3">
              <div class="col-sm-6">
                <span class="text-muted small d-block">Order Status:</span>
                <span id="order-status-badge" class="fs-6 mt-1 d-inline-block"></span>
              </div>
              <div class="col-sm-6">
                <span class="text-muted small d-block">Payment Method:</span>
                <span id="order-pay-method" class="fw-semibold text-dark">Cash on Delivery</span>
              </div>
              <div class="col-sm-6">
                <span class="text-muted small d-block">Payment Status:</span>
                <span id="order-pay-status" class="fw-semibold text-dark">PENDING</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Address & Total Summary -->
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-3 p-4 bg-white mb-4">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Delivery Address</h5>
            <div id="shipping-address-box" class="small text-secondary"></div>
          </div>

          <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Billing Details</h5>
            <div class="d-flex justify-content-between mb-2 small">
              <span class="text-muted">Subtotal:</span>
              <span class="fw-bold text-dark" id="order-subtotal">₹0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-2 small text-success" id="order-discount-row">
              <span>Coupon Discount:</span>
              <span class="fw-bold" id="order-discount">-₹0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-3 small">
              <span class="text-muted">Delivery Charges:</span>
              <span class="text-success fw-medium">FREE</span>
            </div>
            <div class="d-flex justify-content-between border-top pt-3">
              <span class="fw-bold fs-5">Grand Total:</span>
              <span class="fw-bold fs-4 text-danger" id="order-grandtotal">₹0.00</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let currentOrder = null;

    async function loadOrder() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = '/orders.html';
        return;
      }

      try {
        const res = await Bookverse.apiFetch(`/api/orders/${id}`);
        currentOrder = res.data;
        document.getElementById('order-loading').style.display = 'none';
        document.getElementById('order-content').style.display = 'block';

        document.getElementById('order-number-title').textContent = `Order #${currentOrder.orderNumber}`;
        document.getElementById('order-date-text').textContent = `Placed on ${new Date(currentOrder.createdAt).toLocaleString('en-IN')}`;

        // Status badge
        const badgeSpan = document.getElementById('order-status-badge');
        badgeSpan.innerHTML = getStatusBadge(currentOrder.orderStatus);

        document.getElementById('order-pay-method').textContent = currentOrder.paymentMethod || 'Cash on Delivery';
        document.getElementById('order-pay-status').textContent = currentOrder.paymentStatus || 'PENDING';

        // Address
        document.getElementById('shipping-address-box').innerHTML = `
          <strong>${currentOrder.recipientName}</strong><br>
          Phone: ${currentOrder.phoneNumber}<br>
          ${currentOrder.shippingStreet}<br>
          ${currentOrder.shippingCity}, ${currentOrder.shippingState} - ${currentOrder.shippingPostalCode}<br>
          ${currentOrder.shippingCountry}
        `;

        // Billing
        document.getElementById('order-subtotal').textContent = Bookverse.formatCurrency(currentOrder.subtotal);
        if (currentOrder.discountAmount > 0) {
          document.getElementById('order-discount-row').style.display = 'flex';
          document.getElementById('order-discount').textContent = `-${Bookverse.formatCurrency(currentOrder.discountAmount)}`;
        } else {
          document.getElementById('order-discount-row').style.display = 'none';
        }
        document.getElementById('order-grandtotal').textContent = Bookverse.formatCurrency(currentOrder.grandTotal);

        // Cancel button if status is PLACED
        const actionsSlot = document.getElementById('order-actions-slot');
        if (currentOrder.orderStatus === 'PLACED' || currentOrder.orderStatus === 'CONFIRMED') {
          actionsSlot.innerHTML = `
            <button class="btn btn-outline-danger btn-sm" onclick="cancelThisOrder(${currentOrder.id})">
              <i class="bi bi-x-circle me-1"></i> Cancel Order
            </button>
          `;
        } else {
          actionsSlot.innerHTML = '';
        }

        // Render item snapshots
        const itemsContainer = document.getElementById('order-items-container');
        itemsContainer.innerHTML = currentOrder.items.map(item => `
          <div class="d-flex align-items-center gap-3 border-bottom pb-2">
            <img src="${item.coverImageUrl || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80'}" style="width: 50px; height: 70px; object-fit: cover;" class="rounded shadow-sm">
            <div class="flex-grow-1">
              <h6 class="fw-bold mb-1">${item.bookTitle}</h6>
              <div class="small text-muted">ISBN: ${item.isbn || 'N/A'} • Unit Price: ${Bookverse.formatCurrency(item.unitPrice)}</div>
              <div class="small text-muted">Quantity: ${item.quantity}</div>
            </div>
            <div class="fw-bold text-dark">${Bookverse.formatCurrency(item.lineTotal)}</div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('order-loading').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'PLACED': return '<span class="badge bg-primary">Order Placed</span>';
        case 'CONFIRMED': return '<span class="badge bg-info text-dark">Confirmed</span>';
        case 'PACKED': return '<span class="badge bg-warning text-dark">Packed</span>';
        case 'SHIPPED': return '<span class="badge bg-primary">Shipped</span>';
        case 'DELIVERED': return '<span class="badge bg-success">Delivered</span>';
        case 'CANCELLED': return '<span class="badge bg-danger">Cancelled</span>';
        default: return `<span class="badge bg-secondary">${status}</span>`;
      }
    }

    async function cancelThisOrder(id) {
      if (!confirm("Are you sure you want to cancel this order? Inventory will be restored.")) return;
      try {
        await Bookverse.apiFetch(`/api/orders/${id}/cancel`, { method: 'POST' });
        Bookverse.showToast("Order cancelled successfully", "info");
        loadOrder();
      } catch (err) {
        Bookverse.showToast(err.message || "Failed to cancel order", "error");
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrder);
  </script>
</body>
</html>
