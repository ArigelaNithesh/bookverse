<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Orders — BOOKVERSE Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg bv-navbar sticky-top bg-white border-bottom shadow-sm">
    <div class="container-fluid px-4">
      <a class="bv-brand" href="/admin/index.html"><i class="bi bi-book-half fs-3"></i><span>BOOKVERSE <span class="badge bg-danger ms-2 fs-6">ADMIN</span></span></a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="/admin/books.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-journal-album me-1"></i>Manage Books</a>
        <div id="nav-user-slot"></div>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <div class="row">
      <div class="col-lg-2 mb-4">
        <div class="list-group shadow-sm border-0 rounded-3">
          <a href="/admin/index.html" class="list-group-item list-group-item-action">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
          <a href="/admin/books.html" class="list-group-item list-group-item-action">
            <i class="bi bi-journal-album me-2"></i>Manage Books
          </a>
          <a href="/admin/import.html" class="list-group-item list-group-item-action text-primary fw-semibold">
            <i class="bi bi-cloud-arrow-down me-2"></i>Import Open Library
          </a>
          <a href="/admin/orders.html" class="list-group-item list-group-item-action active fw-semibold text-white">
            <i class="bi bi-box-seam me-2"></i>Orders
          </a>
          <a href="/admin/customers.html" class="list-group-item list-group-item-action">
            <i class="bi bi-people me-2"></i>Customers
          </a>
        </div>
      </div>

      <div class="col-lg-10">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h3 class="fw-bold mb-1 brand-font">Customer Orders</h3>
            <p class="text-muted small mb-0">Track order fulfillment, payment status, and update shipment progression.</p>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light small text-muted">
                  <tr>
                    <th>Order #</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Fulfillment Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="orders-tbody">
                  <tr><td colspan="8" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>Loading orders...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadAdminOrders() {
      const tbody = document.getElementById('orders-tbody');
      try {
        const res = await Bookverse.apiFetch('/api/admin/orders');
        if (res.success && res.data && res.data.content) {
          const list = res.data.content;
          if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">No orders placed yet.</td></tr>';
            return;
          }
          tbody.innerHTML = list.map(o => `
            <tr>
              <td><code>${o.orderNumber}</code></td>
              <td class="small text-muted">${new Date(o.createdAt).toLocaleDateString()}</td>
              <td><div class="fw-semibold">${o.customerName || 'Customer'}</div><div class="small text-muted">${o.customerEmail || ''}</div></td>
              <td>${o.items ? o.items.length : 0} items</td>
              <td class="fw-bold">${Bookverse.formatCurrency(o.totalAmount)}</td>
              <td><span class="badge bg-success-subtle text-success">${o.paymentStatus}</span></td>
              <td>
                <select class="form-select form-select-sm" onchange="updateStatus(${o.id}, this.value)" style="width: 140px;">
                  <option value="PENDING" ${o.status === 'PENDING' ? 'selected' : ''}>PENDING</option>
                  <option value="CONFIRMED" ${o.status === 'CONFIRMED' ? 'selected' : ''}>CONFIRMED</option>
                  <option value="PROCESSING" ${o.status === 'PROCESSING' ? 'selected' : ''}>PROCESSING</option>
                  <option value="SHIPPED" ${o.status === 'SHIPPED' ? 'selected' : ''}>SHIPPED</option>
                  <option value="DELIVERED" ${o.status === 'DELIVERED' ? 'selected' : ''}>DELIVERED</option>
                  <option value="CANCELLED" ${o.status === 'CANCELLED' ? 'selected' : ''}>CANCELLED</option>
                </select>
              </td>
              <td class="text-end">
                <a href="/order-details.html?id=${o.id}" class="btn btn-sm btn-outline-primary">Details</a>
              </td>
            </tr>
          `).join('');
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${err.message}</td></tr>`;
      }
    }

    async function updateStatus(id, newStatus) {
      try {
        await Bookverse.apiFetch(`/api/admin/orders/${id}/status`, {
          method: 'PATCH',
          body: { status: newStatus, notes: `Status updated to ${newStatus} by admin` }
        });
        Bookverse.showToast("Order status updated", "success");
      } catch (e) {
        Bookverse.showToast(e.message || "Failed to update status", "error");
        loadAdminOrders();
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await Bookverse.initNavbar();
      loadAdminOrders();
    });
  </script>
</body>
</html>
