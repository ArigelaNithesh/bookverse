<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — BOOKVERSE Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg bv-navbar sticky-top bg-white border-bottom shadow-sm">
    <div class="container-fluid px-4">
      <a class="bv-brand" href="/admin/index.html"><i class="bi bi-book-half fs-3"></i><span>BOOKVERSE <span class="badge bg-danger ms-2 fs-6">ADMIN</span></span></a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="/admin/books.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-journal-album me-1"></i>Manage Books</a>
        <div id="nav-user-slot"></div>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <div class="row">
      <div class="col-lg-2 mb-4">
        <div class="list-group shadow-sm border-0 rounded-3">
          <a href="/admin/index.html" class="list-group-item list-group-item-action">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
          <a href="/admin/books.html" class="list-group-item list-group-item-action">
            <i class="bi bi-journal-album me-2"></i>Manage Books
          </a>
          <a href="/admin/import.html" class="list-group-item list-group-item-action text-primary fw-semibold">
            <i class="bi bi-cloud-arrow-down me-2"></i>Import Open Library
          </a>
          <a href="/admin/orders.html" class="list-group-item list-group-item-action">
            <i class="bi bi-box-seam me-2"></i>Orders
          </a>
          <a href="/admin/categories.html" class="list-group-item list-group-item-action active fw-semibold text-white">
            <i class="bi bi-tags me-2"></i>Categories
          </a>
        </div>
      </div>

      <div class="col-lg-10">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h3 class="fw-bold mb-1 brand-font">Categories & Taxonomies</h3>
            <p class="text-muted small mb-0">Manage hierarchical bookstore genres and subjects.</p>
          </div>
          <button class="btn btn-bv-primary" data-bs-toggle="modal" data-bs-target="#newCategoryModal">
            <i class="bi bi-plus-circle me-1"></i>New Category
          </button>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light small text-muted">
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Slug</th>
                    <th>Description</th>
                    <th>Subcategories</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="cats-tbody">
                  <tr><td colspan="6" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>Loading categories...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL CREATE CATEGORY -->
  <div class="modal fade" id="newCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form onsubmit="createCategory(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-bold">Category Name *</label>
              <input type="text" id="cat-name" class="form-control" required placeholder="e.g. Philosophy">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Slug (Optional)</label>
              <input type="text" id="cat-slug" class="form-control" placeholder="e.g. philosophy">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Description</label>
              <textarea id="cat-desc" class="form-control" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-bv-primary">Save Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadCategories() {
      const tbody = document.getElementById('cats-tbody');
      try {
        const res = await Bookverse.apiFetch('/api/categories');
        if (res.success && res.data) {
          tbody.innerHTML = res.data.map(c => `
            <tr>
              <td><code>#${c.id}</code></td>
              <td class="fw-semibold">${c.name}</td>
              <td><code>${c.slug}</code></td>
              <td class="small text-muted">${c.description || '—'}</td>
              <td><span class="badge bg-secondary">${c.subcategories ? c.subcategories.length : 0} subs</span></td>
              <td><span class="badge ${c.active ? 'bg-success' : 'bg-secondary'}">${c.active ? 'Active' : 'Hidden'}</span></td>
            </tr>
          `).join('');
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">${err.message}</td></tr>`;
      }
    }

    async function createCategory(e) {
      e.preventDefault();
      const name = document.getElementById('cat-name').value.trim();
      const slug = document.getElementById('cat-slug').value.trim() || name.toLowerCase().replace(/[^a-z0-9-]/g, '-');
      const desc = document.getElementById('cat-desc').value.trim();

      try {
        await Bookverse.apiFetch('/api/admin/categories', {
          method: 'POST',
          body: { name: name, slug: slug, description: desc, active: true }
        });
        Bookverse.showToast("Category created", "success");
        bootstrap.Modal.getInstance(document.getElementById('newCategoryModal')).hide();
        loadCategories();
      } catch (err) {
        Bookverse.showToast(err.message || "Failed to create category", "error");
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await Bookverse.initNavbar();
      loadCategories();
    });
  </script>
</body>
</html>
