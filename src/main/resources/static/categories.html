<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Categories — BOOKVERSE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bv-navbar sticky-top">
    <div class="container">
      <a class="bv-brand" href="/index.html"><i class="bi bi-book-half fs-3"></i><span>BOOKVERSE</span></a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#bvNavbarContent"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="bvNavbarContent">
        <ul class="navbar-nav me-auto ms-3">
          <li class="nav-item"><a class="nav-link bv-nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link bv-nav-link" href="/books.html">Browse Books</a></li>
          <li class="nav-item"><a class="nav-link bv-nav-link active" href="/categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link bv-nav-link" href="/read.html">Digital Reader</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a href="/cart.html" class="btn btn-sm btn-bv-outline position-relative px-2 py-1"><i class="bi bi-cart3 fs-6"></i><span id="cart-counter-badge" class="nav-badge" style="display:none;">0</span></a>
          <div id="nav-user-slot" class="d-flex align-items-center gap-2"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 fw-bold mb-2">Subject Categories</h1>
    <p class="text-muted small mb-4">Explore books categorized across technology, academics, science, and humanities.</p>

    <div id="categories-grid" class="row g-4">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadCategories() {
      try {
        const res = await Bookverse.apiFetch('/api/categories');
        const grid = document.getElementById('categories-grid');
        if (res.data && res.data.length > 0) {
          grid.innerHTML = res.data.map(cat => `
            <div class="col-md-6 col-lg-4">
              <div class="card h-100 border-0 shadow-sm rounded-3 p-4 bg-white">
                <h5 class="fw-bold mb-2 text-primary">
                  <a href="/books.html?categoryId=${cat.id}" class="text-decoration-none text-dark">${cat.name}</a>
                </h5>
                <p class="text-muted small mb-3">${cat.description || 'Subject collection'}</p>
                ${cat.subcategories && cat.subcategories.length > 0 ? `
                  <div class="d-flex flex-wrap gap-1 mt-auto">
                    ${cat.subcategories.map(sub => `
                      <a href="/books.html?categoryId=${sub.id}" class="badge bg-light text-secondary border text-decoration-none py-1 px-2">${sub.name}</a>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        document.getElementById('categories-grid').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }
    document.addEventListener('DOMContentLoaded', loadCategories);
  </script>
</body>
</html>
