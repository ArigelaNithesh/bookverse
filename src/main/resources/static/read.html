<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Reader — BOOKVERSE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body.reader-light { background-color: #faf9f6; color: #1f2937; }
    body.reader-dark { background-color: #121820; color: #e2e8f0; }
    body.reader-sepia { background-color: #f4ecd8; color: #433422; }

    .reader-navbar {
      border-bottom: 1px solid rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    body.reader-dark .reader-navbar {
      background-color: rgba(18, 24, 32, 0.95);
      border-color: #2d3748;
    }
    body.reader-light .reader-navbar {
      background-color: rgba(250, 249, 246, 0.95);
    }
    body.reader-sepia .reader-navbar {
      background-color: rgba(244, 236, 216, 0.95);
      border-color: #e5dac2;
    }

    .reading-content-container {
      font-family: 'Lora', serif;
      max-width: 760px;
      margin: 2rem auto 5rem;
      padding: 0 1.5rem;
      line-height: 1.85;
      font-size: 1.15rem;
    }

    .reading-progress-bar-fixed {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: var(--bv-primary);
      z-index: 1050;
      transition: width 0.1s;
    }
  </style>
</head>
<body class="reader-light">

  <div id="read-progress-indicator" class="reading-progress-bar-fixed" style="width: 0%;"></div>

  <!-- Reader Toolbar Navbar -->
  <nav class="reader-navbar py-2">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div class="d-flex align-items-center gap-3">
        <a href="/index.html" class="btn btn-sm btn-outline-secondary" title="Exit to Bookstore">
          <i class="bi bi-arrow-left"></i> Exit
        </a>
        <h6 class="mb-0 fw-bold text-truncate" id="reader-book-title" style="max-width: 260px;">Loading book...</h6>
      </div>

      <div class="d-flex align-items-center gap-2">
        <!-- Font sizing -->
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary" onclick="changeFontSize(-1)" title="Smaller text">A-</button>
          <button class="btn btn-outline-secondary" onclick="changeFontSize(1)" title="Larger text">A+</button>
        </div>

        <!-- Theme toggles -->
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary" onclick="setTheme('reader-light')" title="Light Mode"><i class="bi bi-sun"></i></button>
          <button class="btn btn-outline-secondary" onclick="setTheme('reader-sepia')" title="Sepia Mode"><i class="bi bi-book"></i></button>
          <button class="btn btn-outline-secondary" onclick="setTheme('reader-dark')" title="Dark Mode"><i class="bi bi-moon"></i></button>
        </div>

        <!-- Bookmarks drawer toggle -->
        <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="offcanvas" data-bs-target="#bookmarksDrawer">
          <i class="bi bi-bookmark"></i> Bookmarks
        </button>

        <span class="small fw-semibold ms-2 text-muted" id="reading-pct-text">0%</span>
      </div>
    </div>
  </nav>

  <!-- Reading Text Container -->
  <main class="reading-content-container" id="reading-body">
    <div class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-muted">Opening digital reading edition...</p>
    </div>
  </main>

  <!-- Bookmarks Offcanvas Drawer -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="bookmarksDrawer">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold"><i class="bi bi-bookmarks me-2 text-primary"></i>My Bookmarks</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <button class="btn btn-sm btn-bv-primary w-100 mb-3" onclick="openAddBookmarkPrompt()">
        <i class="bi bi-plus-circle me-1"></i> Bookmark Current Position
      </button>
      <div id="bookmarks-list" class="d-flex flex-column gap-2"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let bookId = 9; // Default Pride & Prejudice
    let currentFontSize = 1.15;
    let totalScrollHeight = 1;

    function setTheme(theme) {
      document.body.className = theme;
      localStorage.setItem('bv_reader_theme', theme);
    }

    function changeFontSize(dir) {
      currentFontSize = Math.max(0.85, Math.min(1.8, currentFontSize + dir * 0.1));
      document.getElementById('reading-body').style.fontSize = `${currentFontSize}rem`;
    }

    async function loadDigitalReader() {
      const savedTheme = localStorage.getItem('bv_reader_theme');
      if (savedTheme) setTheme(savedTheme);

      const params = new URLSearchParams(window.location.search);
      if (params.get('bookId')) {
        bookId = parseInt(params.get('bookId'));
      }

      try {
        const res = await Bookverse.apiFetch(`/api/reading/${bookId}/content`);
        const data = res.data;

        document.getElementById('reader-book-title').textContent = data.bookTitle;
        document.title = `${data.bookTitle} — Digital Reader`;

        // Format Markdown-like text to HTML
        let formatted = data.fullText || "No text available.";
        formatted = formatted
          .replace(/### (.*)/g, '<h2 class="mt-4 mb-3 fw-bold">$1</h2>')
          .replace(/#### (.*)/g, '<h4 class="mt-4 mb-2 fw-semibold">$1</h4>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/\n\n/g, '</p><p>');

        document.getElementById('reading-body').innerHTML = `
          <div class="mb-4 pb-3 border-bottom text-muted small">
            ${data.rightsNotice || 'Authorized Open Edition'}
          </div>
          <div id="main-reading-paragraphs"><p>${formatted}</p></div>
        `;

        loadBookmarks();
        initScrollTracking();
      } catch (err) {
        document.getElementById('reading-body').innerHTML = `
          <div class="alert alert-danger">
            <h5>Unable to load reading content</h5>
            <p>${err.message}</p>
            <a href="/books.html" class="btn btn-sm btn-outline-dark">Return to Catalog</a>
          </div>
        `;
      }
    }

    function initScrollTracking() {
      window.addEventListener('scroll', () => {
        const h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (h > 0) {
          const scrolled = window.scrollY;
          const pct = Math.min(100, Math.round((scrolled / h) * 100));
          document.getElementById('read-progress-indicator').style.width = `${pct}%`;
          document.getElementById('reading-pct-text').textContent = `${pct}%`;
        }
      });

      // Auto save progress every 8 seconds if changed
      setInterval(async () => {
        if (!Bookverse.currentUser) return;
        const h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (h <= 0) return;
        const pct = Math.min(100, Math.round((window.scrollY / h) * 100));
        try {
          await Bookverse.apiFetch(`/api/reading/${bookId}/progress`, {
            method: 'PUT',
            body: { lastPositionScroll: Math.round(window.scrollY), completionPercentage: pct }
          });
        } catch (e) {}
      }, 8000);
    }

    async function loadBookmarks() {
      if (!Bookverse.currentUser) {
        document.getElementById('bookmarks-list').innerHTML = '<div class="small text-muted">Sign in to save and sync bookmarks.</div>';
        return;
      }
      try {
        const res = await Bookverse.apiFetch(`/api/reading/${bookId}/bookmarks`);
        const list = document.getElementById('bookmarks-list');
        if (res.data && res.data.length > 0) {
          list.innerHTML = res.data.map(bm => `
            <div class="p-2 border rounded-2 bg-white d-flex justify-content-between align-items-center">
              <div>
                <a href="#" class="fw-semibold text-dark text-decoration-none small" onclick="jumpToPosition(${bm.positionIndex})">${bm.title}</a>
                <div class="text-muted" style="font-size: 0.75rem;">${bm.note || ''}</div>
              </div>
              <button class="btn btn-sm btn-link text-danger p-0" onclick="deleteBookmark(${bm.id})"><i class="bi bi-trash"></i></button>
            </div>
          `).join('');
        } else {
          list.innerHTML = '<div class="small text-muted">No bookmarks added yet.</div>';
        }
      } catch (e) {}
    }

    function jumpToPosition(pos) {
      window.scrollTo({ top: pos, behavior: 'smooth' });
    }

    async function openAddBookmarkPrompt() {
      if (!Bookverse.currentUser) {
        Bookverse.showToast("Please sign in to place bookmarks", "info");
        return;
      }
      const title = prompt("Enter bookmark title:", `Position at ${document.getElementById('reading-pct-text').textContent}`);
      if (!title) return;

      try {
        await Bookverse.apiFetch(`/api/reading/${bookId}/bookmarks`, {
          method: 'POST',
          body: { title, positionIndex: Math.round(window.scrollY), note: "Saved bookmark" }
        });
        Bookverse.showToast("Bookmark saved!", "success");
        loadBookmarks();
      } catch (err) {
        Bookverse.showToast(err.message, "error");
      }
    }

    async function deleteBookmark(bmId) {
      try {
        await Bookverse.apiFetch(`/api/reading/bookmarks/${bmId}`, { method: 'DELETE' });
        loadBookmarks();
      } catch (err) {
        Bookverse.showToast(err.message, "error");
      }
    }

    document.addEventListener('DOMContentLoaded', loadDigitalReader);
  </script>
</body>
</html>
